name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: powershell
        run: .\release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AudioMe-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
