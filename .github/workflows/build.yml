name: Windows build
on:
  push:
    branches: ['**']
    # Pushing a tag such as v1.2.0 also publishes a GitHub Release with the zip attached.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: powershell
        run: .\release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AudioMe-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AudioMe-win-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Audio Me ${{ github.ref_name }} beta
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
